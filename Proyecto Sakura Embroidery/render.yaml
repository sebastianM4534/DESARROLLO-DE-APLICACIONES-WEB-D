databases:
  - name: sakura-embroidery-db
    plan: free
    databaseName: sakura_embroidery_db
    user: sakura_embroidery_user

services:
  - type: web
    name: sakura-embroidery-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sakura-embroidery-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: FLASK_DEBUG
        value: "False"
